    <circle cx="22" cy="22" r="1.2" fill="#064e3b" />
  </g>

  <!-- Wordmark -->
  <text x="58" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">Eco<tspan fill="#34d399">Sort</tspan></text>
  
  <!-- Subtle Badge Dot -->
  <circle cx="166" cy="18" r="3" fill="#34d399" />

  <!-- Subtitle Tagline -->
  <text x="59" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.12em" fill="#94a3b8" text-transform="uppercase">Smart Segregation</text>
